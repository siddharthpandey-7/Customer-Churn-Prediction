<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 12px;
            display: block;
        }

        select, input {
            width: 100%;
            padding: 9px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .churn {
            background: #ffe3e3;
            color: #b30000;
        }

        .stay {
            background: #e6ffea;
            color: #006b2e;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Customer Churn Prediction</h2>

    <form method="post">

        <label>Gender</label>
        <select name="gender">
            <option>Male</option>
            <option>Female</option>
        </select>

        <label>Senior Citizen</label>
        <select name="SeniorCitizen">
            <option>No</option>
            <option>Yes</option>
        </select>

        <label>Tenure (months)</label>
        <input type="number" name="tenure" required>

        <label>Monthly Charges</label>
        <input type="number" step="0.01" name="MonthlyCharges" required>

        <label>Total Charges</label>
        <input type="number" step="0.01" name="TotalCharges" required>

        <label>Contract</label>
        <select name="Contract">
            <option>Month-to-month</option>
            <option>One year</option>
            <option>Two year</option>
        </select>

        <label>Tech Support</label>
        <select name="TechSupport">
            <option>No</option>
            <option>Yes</option>
        </select>

        <label>Payment Method</label>
        <select name="PaymentMethod">
            <option>Electronic check</option>
            <option>Mailed check</option>
            <option>Bank transfer (automatic)</option>
            <option>Credit card (automatic)</option>
        </select>

        <button type="submit">Predict Churn</button>
    </form>

    {% if prediction %}
        <div class="result {{ 'churn' if prediction == 'Churn' else 'stay' }}">
            <h3>{{ prediction }}</h3>
            <p>Churn Probability: {{ probability }}</p>
        </div>
    {% endif %}
</div>
</body>
</html>
